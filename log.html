<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOD EYE - Login</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <header>
        <h1>👁️ GOD EYE</h1>
        <p>AI Powered Intelligent Security System</p>
    </header>

    <section id="login">

        <h2>🔐 Login</h2>

        <form id="loginForm">

            <label for="username">Username:</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

            <label for="password">Password:</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="loginMessage"></p>

        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

    </section>

    <footer>
        <p>God Eye Project</p>
        <p>AI Powered Context Aware Intelligent System</p>
    </footer>

    <script src="index.js"></script>

</body>

</html>
